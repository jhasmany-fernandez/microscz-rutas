<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Ruta compartida · MicroSCZ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.css">
<script defer src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
<style>
body { margin: 0; background: #f1f5f6; color: #192126; font: 1rem system-ui, sans-serif; }
header { background: #192126; color: #bbf246; padding: 1rem; font-weight: 700; }
main { max-width: 36rem; margin: auto; padding: 1.25rem; }
ol { padding: 1rem 1rem 1rem 2.5rem; background: white; border-radius: 1rem; }
li { margin-block: .65rem; }
a { display: inline-block; background: #bbf246; color: #192126; padding: .75rem 1rem; border-radius: 1.5rem; font-weight: 700; }
[hidden] { display: none !important; }
#map { height: clamp(17rem, 49vh, 29rem); background: #dde5e6; border-radius: 1rem; }
.actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-block: 1rem; }
.actions a { text-decoration: none; }
#google { background: white; border: 1px solid #819095; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; margin-block: .6rem; font-size: .875rem; }
.legend span::before { content: ''; display: inline-block; width: .85rem; height: .3rem; margin-right: .35rem; background: var(--color); vertical-align: middle; }
</style>
</head>
<body>
<header>MicroSCZ</header>
<main>
<h1 id="title">Ruta compartida</h1>
<p id="status">Cargando indicaciones…</p>
<div id="map" aria-label="Mapa del recorrido compartido" hidden></div>
<div id="legend" class="legend" hidden></div>
<div class="actions">
  <a id="open" hidden>Abrir recorrido en MicroSCZ</a>
  <a id="google" hidden>Abrir en Google Maps</a>
</div>
<ol id="steps" hidden></ol>
<noscript>Activa JavaScript para leer las indicaciones.</noscript>
</main>
<script type="module">
const token = location.hash.slice(1);
const status = document.querySelector('#status');
try {
  if (!/^[A-Za-z0-9_-]{1,8192}$/.test(token)) throw new Error();
  const padded = token.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(token.length / 4) * 4, '=');
  const data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(padded), c => c.charCodeAt(0))));
  const directions = data[4];
  if (data[0] !== 1 || !Array.isArray(directions) || directions.length < 2 ||
      directions.length > 10 || directions.some(step => typeof step !== 'string' || step.length > 600)) throw new Error();
  document.querySelector('#title').textContent = directions[0];
  const steps = document.querySelector('#steps');
  for (const step of directions.slice(1)) {
    const li = document.createElement('li');
    li.textContent = step;
    steps.append(li);
  }
  steps.hidden = false;
  const open = document.querySelector('#open');
  open.href = 'microscz://ruta#' + token;
  open.hidden = false;
  status.textContent = '';
  const origin = readPlace(data[1]);
  const destination = readPlace(data[2]);
  const google = document.querySelector('#google');
  const url = new URL('https://www.google.com/maps/dir/');
  url.search = new URLSearchParams({
    api: '1',
    origin: [...origin].reverse().join(','),
    destination: [...destination].reverse().join(','),
    travelmode: 'transit',
  });
  google.href = url.href;
  google.hidden = false;
  google.title = 'Google Maps calcula su propio viaje en transporte público';
  const renderMap = () => showMap(origin, destination, data[3]).catch(() => {
    document.querySelector('#map').hidden = true;
    status.textContent = 'El mapa no está disponible. Puedes seguir las indicaciones de abajo.';
  });
  if (document.readyState === 'complete') renderMap();
  else window.addEventListener('load', renderMap, {once: true});
} catch {
  status.textContent = 'Este enlace está incompleto o no es compatible.';
}

function readPlace(place) {
  if (!Array.isArray(place) || place.length !== 3 ||
      !Number.isFinite(place[1]) || Math.abs(place[1]) > 90 ||
      !Number.isFinite(place[2]) || Math.abs(place[2]) > 180) throw new Error();
  return [place[2], place[1]];
}

async function loadLeg(ref) {
  if (!Array.isArray(ref) || ref.length !== 6 ||
      typeof ref[0] !== 'string' || !/^\d{1,12}$/.test(ref[0])) throw new Error();
  const [line, direction, start, from, end, to] = ref;
  const response = await fetch('./geometria/' + line + '.json');
  if (!response.ok) throw new Error();
  const source = (await response.json()).find(item => item.id === direction)?.coordinates;
  if (!source || ![start, end].every(i => Number.isInteger(i) && i >= 0 && i < source.length - 1) ||
      ![from, to].every(value => Number.isFinite(value) && value >= 0 && value <= 1)) throw new Error();
  const interpolate = (index, fraction) => source[index].map(
    (value, axis) => value + (source[index + 1][axis] - value) * fraction
  );
  const vertices = end < start || (end === start && to < from)
    ? [...source.slice(start + 1), ...source.slice(0, end + 1)]
    : source.slice(start + 1, end + 1);
  return {line, points: [interpolate(start, from), ...vertices, interpolate(end, to)]};
}

async function showMap(origin, destination, refs) {
  if (!Array.isArray(refs) || refs.length < 1 || refs.length > 3 || !window.maplibregl) throw new Error();
  const legs = await Promise.all(refs.map(loadLeg));
  const colors = ['#006b54', '#9e3d09', '#5351a1'];
  const walkColor = '#48525b';
  const features = [];
  const bounds = new maplibregl.LngLatBounds(origin, origin);
  function add(type, coordinates, color, kind) {
    features.push({type: 'Feature', geometry: {type, coordinates}, properties: {color, kind}});
  }
  let previous = origin;
  for (const [index, leg] of legs.entries()) {
    const start = leg.points[0];
    add('LineString', [previous, start], walkColor, 'walk');
    add('Point', start, colors[index], 'stop');
    add('LineString', leg.points, colors[index], 'ride');
    leg.points.forEach(point => bounds.extend(point));
    previous = leg.points.at(-1);
    add('Point', previous, colors[index], 'stop');
  }
  add('LineString', [previous, destination], walkColor, 'walk');
  add('Point', origin, '#192126', 'endpoint');
  add('Point', destination, '#a1253b', 'endpoint');
  bounds.extend(destination);

  const container = document.querySelector('#map');
  container.hidden = false;
  const map = new maplibregl.Map({
    container,
    style: 'https://tiles.openfreemap.org/styles/liberty',
    bounds,
    fitBoundsOptions: {padding: 34, maxZoom: 17},
    dragRotate: false,
    touchPitch: false,
    scrollZoom: false,
  });
  map.addControl(new maplibregl.NavigationControl({showCompass: false}));
  map.once('load', () => {
    map.addSource('shared-trip', {type: 'geojson', data: {type: 'FeatureCollection', features}});
    for (const kind of ['walk', 'ride']) {
      map.addLayer({
        id: kind, type: 'line', source: 'shared-trip',
        filter: ['==', ['get', 'kind'], kind],
        paint: {
          'line-color': ['get', 'color'],
          'line-width': kind === 'ride' ? 5 : 3,
          ...(kind === 'walk' ? {'line-dasharray': [2, 2]} : {}),
        },
        layout: {'line-cap': 'round', 'line-join': 'round'},
      });
    }
    map.addLayer({
      id: 'shared-stops', type: 'circle', source: 'shared-trip',
      filter: ['==', ['geometry-type'], 'Point'],
      paint: {
        'circle-color': ['get', 'color'],
        'circle-radius': ['case', ['==', ['get', 'kind'], 'endpoint'], 7, 4],
        'circle-stroke-width': 2, 'circle-stroke-color': '#fff',
      },
    });
    const legend = document.querySelector('#legend');
    const entries = [
      ['Partida', '#192126'], ['Llegada', '#a1253b'],
      ...legs.map((leg, index) => ['Línea ' + leg.line, colors[index]]),
      ['Caminata aproximada', walkColor],
    ];
    for (const [label, color] of entries) {
      const entry = document.createElement('span');
      entry.textContent = label;
      entry.style.setProperty('--color', color);
      legend.append(entry);
    }
    legend.hidden = false;
  });
  await new Promise((resolve, reject) => {
    const timeout = setTimeout(() => {
      map.remove();
      reject(new Error('El mapa tardó demasiado'));
    }, 15000);
    map.once('load', () => {
      clearTimeout(timeout);
      resolve();
    });
  });
}
</script>
</body>
</html>
