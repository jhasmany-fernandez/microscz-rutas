<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Ruta compartida · MicroSCZ</title>
<style>
body { margin: 0; background: #f1f5f6; color: #192126; font: 1rem system-ui, sans-serif; }
header { background: #192126; color: #bbf246; padding: 1rem; font-weight: 700; }
main { max-width: 36rem; margin: auto; padding: 1.25rem; }
ol { padding: 1rem 1rem 1rem 2.5rem; background: white; border-radius: 1rem; }
li { margin-block: .65rem; }
a { display: inline-block; background: #bbf246; color: #192126; padding: .75rem 1rem; border-radius: 1.5rem; font-weight: 700; }
</style>
</head>
<body>
<header>MicroSCZ</header>
<main>
<h1 id="title">Ruta compartida</h1>
<p id="status">Cargando indicaciones…</p>
<ol id="steps" hidden></ol>
<a id="open" hidden>Abrir recorrido en MicroSCZ</a>
<noscript>Activa JavaScript para leer las indicaciones.</noscript>
</main>
<script>
const token = location.hash.slice(1);
const status = document.querySelector('#status');
try {
  if (!/^[A-Za-z0-9_-]{1,8192}$/.test(token)) throw new Error();
  const padded = token.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(token.length / 4) * 4, '=');
  const data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(padded), c => c.charCodeAt(0))));
  const directions = data[4];
  if (data[0] !== 1 || !Array.isArray(directions) || directions.length < 2 ||
      directions.length > 10 || directions.some(step => typeof step !== 'string' || step.length > 600)) throw new Error();
  document.querySelector('#title').textContent = directions[0];
  const steps = document.querySelector('#steps');
  for (const step of directions.slice(1)) {
    const li = document.createElement('li');
    li.textContent = step;
    steps.append(li);
  }
  steps.hidden = false;
  const open = document.querySelector('#open');
  open.href = 'microscz://ruta#' + token;
  open.hidden = false;
  status.textContent = 'Puedes leer las indicaciones aquí o abrir el mapa si tienes la app instalada.';
} catch {
  status.textContent = 'Este enlace está incompleto o no es compatible.';
}
</script>
</body>
</html>
